spring:
  config:
    activate:
      on-profile: test
  datasource:
    # Reutiliza las credenciales de .env. DB_NAME_TEST permite apuntar a un schema
    # distinto al dev (default: veterinaria_test).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME_TEST:veterinaria_test}
    username: ${DB_USERNAME:vetuser}
    password: ${DB_PASSWORD:vetpass}
  jpa:
    hibernate:
      # Solo conecta — no valida ni crea el esquema.
      # Permite testear el contexto sin que el schema completo esté aplicado.
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

  # AI providers — se leen del environment para no commitear API keys.
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    google:
      genai:
        embedding:
          api-key: ${GEMINI_API_KEY:}

app:
  jwt:
    # Valor de test, separado del dev. Viene de .env (JWT_SECRET_TEST).
    secret: ${JWT_SECRET_TEST}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: http://localhost:5173
