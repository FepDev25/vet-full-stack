caseName: Dermatitis alergica canina
input:
  freeText: |
    Paciente canino con prurito intenso en abdomen y axilas desde
    hace 3 semanas. Lesiones por rascado: alopecia, eritema, pápulas.
    Prurito nocturno segun propietario. Come balanceado hace 2 meses
    (cambio reciente de marca). Sin vomitos ni diarrea. Picadura de
    pulgas no evidente.
